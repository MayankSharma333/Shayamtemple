<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ajay Kumar - Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #f9f9f9, #dce9ff);
      color: #333;
    }

    header {
      background: #4b6cb7;
      background: linear-gradient(to right, #182848, #4b6cb7);
      color: white;
      padding: 50px 20px;
      text-align: center;
    }

    header img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid white;
      margin-top: 10px;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 2.8rem;
    }

    .tagline {
      font-size: 1.2rem;
      font-weight: 300;
      margin-top: 10px;
    }

    section {
      padding: 40px 20px;
      text-align: center;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #333;
    }

    .card-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      width: 200px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, background 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      background: #e0f7ff;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .social-icons a {
      text-decoration: none;
      color: white;
      background: #0077cc;
      padding: 10px 14px;
      border-radius: 50%;
      transition: background 0.3s;
    }

    .social-icons a:hover {
      background: #005fa3;
    }

    footer {
      background: #1c1c1c;
      color: white;
      text-align: center;
      padding: 15px 10px;
    }
  </style>
</head>
<body>

<header>
  <img src="https://via.placeholder.com/130" alt="Ajay Kumar">
  <h1>Ajay Kumar</h1>
  <div class="tagline" id="typewriter"></div>
</header>

<section>
  <h2>Soft Skills</h2>
  <div class="card-container">
    <div class="card">Communication</div>
    <div class="card">Teamwork</div>
    <div class="card">Problem Solving</div>
    <div class="card">Time Management</div>
    <div class="card">Adaptability</div>
  </div>

  <h2>Technical Skills</h2>
  <div class="card-container">
    <div class="card">Java</div>
    <div class="card">Python</div>
    <div class="card">C Language</div>
    <div class="card">HTML & CSS</div>
    <div class="card">Git & GitHub</div>
  </div>

  <h2>Connect with Me</h2>
  <div class="social-icons">
    <a href="https://linkedin.com" target="_blank" title="LinkedIn">🔗</a>
    <a href="https://github.com" target="_blank" title="GitHub">💻</a>
    <a href="mailto:ajay@example.com" title="Email">📧</a>
  </div>
</section>

<footer>
  © 2025 Ajay Kumar | All Rights Reserved
</footer>

<script>
  const text = "Aspiring Software Developer | Quick Learner | Team Enthusiast";
  let i = 0;
  function typeWriter() {
    if (i < text.length) {
      document.getElementById("typewriter").innerHTML += text.charAt(i);
      i++;
      setTimeout(typeWriter, 60);
    }
  }
  window.onload = typeWriter;
</script>

</body>
</html>
